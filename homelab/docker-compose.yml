services:
  lg-firmware-monitor:
    build: .
    container_name: lg-firmware-monitor
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      - NTFY_TOPIC=chris-lg-tv-firmware
      - CONFIG_PATH=/app/config/config.yaml
    volumes:
      - ./config.yaml:/app/config/config.yaml
      - ./data:/app/data
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8484/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
